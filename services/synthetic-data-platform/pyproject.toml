[project]
name = "synthetic-data-platform"
version = "0.1.0"
description = "Synthetic data platform PoC for Harbor Platform."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "httpx>=0.27.0",
    "pydantic>=2.11.7",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = ["pytest>=8.4.2", "ruff>=0.16.3"]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"
