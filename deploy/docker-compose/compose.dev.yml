services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: harbor
      MYSQL_DATABASE: harbor_control_plane
      MYSQL_USER: harbor
      MYSQL_PASSWORD: harbor
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uharbor", "-pharbor"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  harbor-api:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.control-plane
    environment:
      HARBOR_CONTROL_PLANE_DATABASE_URL: mysql+pymysql://harbor:harbor@mysql:3306/harbor_control_plane
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ../../harbor-control-plane/config/control-plane.local.toml:/config/control-plane.toml:ro

  synthetic-data-platform:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.synthetic-data-platform
    environment:
      HARBOR_API_BASE_URL: http://harbor-api:8080
      SYNTHETIC_DATA_PLATFORM_DATABASE_URL: mysql+pymysql://harbor:harbor@mysql:3306/harbor_control_plane
    depends_on:
      harbor-api:
        condition: service_started
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"

  synthetic-data-platform-web:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.synthetic-data-platform-web
    environment:
      SYNTHETIC_DATA_PLATFORM_API_TARGET: http://synthetic-data-platform:8081
    depends_on:
      - synthetic-data-platform
    ports:
      - "5173:5173"
