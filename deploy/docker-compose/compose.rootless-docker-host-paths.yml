# Optional override for M5 rootless Docker smoke jobs against an external daemon.
#
# Docker bind mounts are resolved on the daemon host, not inside the runner
# container. Use this together with compose.rootless-docker-tls.yml so the
# runner container and the rootless Docker daemon agree on the same absolute
# dataset and jobs paths.
#
# Example:
#
#   export HARBOR_PLATFORM_HOST_ROOT=$(cd ../.. && pwd)
#   export HARBOR_RUNNER_HOST_JOBS_DIR=$HARBOR_PLATFORM_HOST_ROOT/deploy/docker-compose/.local/runner-jobs
#   export HARBOR_RUNNER_DOCKER_TLS_CERTS=$PWD/.local/rootless-docker-certs
#   mkdir -p "$HARBOR_RUNNER_HOST_JOBS_DIR"
#   docker compose -f compose.dev.yml -f compose.rootless-docker-tls.yml -f compose.rootless-docker-host-paths.yml up --build

services:
  harbor-api:
    environment:
      HARBOR_ARTIFACT_ALLOWED_ROOT: ${HARBOR_RUNNER_HOST_JOBS_DIR:?set HARBOR_RUNNER_HOST_JOBS_DIR to an absolute host path}
    volumes:
      - ${HARBOR_RUNNER_HOST_JOBS_DIR:?set HARBOR_RUNNER_HOST_JOBS_DIR to an absolute host path}:${HARBOR_RUNNER_HOST_JOBS_DIR:?set HARBOR_RUNNER_HOST_JOBS_DIR to an absolute host path}:ro

  harbor-runner-1:
    environment: &host-path-runner-env
      HARBOR_PLATFORM_HOST_ROOT: ${HARBOR_PLATFORM_HOST_ROOT:?set HARBOR_PLATFORM_HOST_ROOT to the repository root absolute path}
      HARBOR_RUNNER_HOST_JOBS_DIR: ${HARBOR_RUNNER_HOST_JOBS_DIR:?set HARBOR_RUNNER_HOST_JOBS_DIR to an absolute host path}
    volumes:
      - ./runner-1.host-paths.toml:/config/runner.toml:ro
      - ${HARBOR_RUNNER_HOST_JOBS_DIR:?set HARBOR_RUNNER_HOST_JOBS_DIR to an absolute host path}:${HARBOR_RUNNER_HOST_JOBS_DIR:?set HARBOR_RUNNER_HOST_JOBS_DIR to an absolute host path}
      - ${HARBOR_PLATFORM_HOST_ROOT:?set HARBOR_PLATFORM_HOST_ROOT to the repository root absolute path}/harbor/generated:${HARBOR_PLATFORM_HOST_ROOT:?set HARBOR_PLATFORM_HOST_ROOT to the repository root absolute path}/harbor/generated:ro

  harbor-runner-2:
    environment: *host-path-runner-env
    volumes:
      - ./runner-2.host-paths.toml:/config/runner.toml:ro
      - ${HARBOR_RUNNER_HOST_JOBS_DIR:?set HARBOR_RUNNER_HOST_JOBS_DIR to an absolute host path}:${HARBOR_RUNNER_HOST_JOBS_DIR:?set HARBOR_RUNNER_HOST_JOBS_DIR to an absolute host path}
      - ${HARBOR_PLATFORM_HOST_ROOT:?set HARBOR_PLATFORM_HOST_ROOT to the repository root absolute path}/harbor/generated:${HARBOR_PLATFORM_HOST_ROOT:?set HARBOR_PLATFORM_HOST_ROOT to the repository root absolute path}/harbor/generated:ro
