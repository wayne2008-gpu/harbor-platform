# Optional override for M5 real Docker smoke jobs over TLS.
#
# This file points runners at an explicitly managed rootless Docker daemon with
# TLS client authentication. Generate certs with:
#
#   ./scripts/create-rootless-docker-tls-certs.sh .local/rootless-docker-certs
#
# Then start rootless dockerd with the server certs and run Compose with:
#
#   export HARBOR_RUNNER_DOCKER_TLS_CERTS=$PWD/.local/rootless-docker-certs
#   docker compose -f compose.dev.yml -f compose.rootless-docker-tls.yml up --build

services:
  harbor-runner-1: &rootless-docker-tls-runner
    environment:
      DOCKER_HOST: ${HARBOR_RUNNER_DOCKER_HOST:-tcp://host.docker.internal:2376}
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /docker-certs/client
    volumes:
      - ${HARBOR_RUNNER_DOCKER_TLS_CERTS:?set HARBOR_RUNNER_DOCKER_TLS_CERTS}/client:/docker-certs/client:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  harbor-runner-2:
    <<: *rootless-docker-tls-runner
