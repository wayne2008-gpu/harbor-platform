# Legacy compatibility override.
#
# COS dataset upload and the result export worker are now included in
# compose.dev.yml by default. Keeping this file lets older runbooks/commands
# that still pass "-f compose.synthetic-upload.yml" continue to work.
services:
  synthetic-data-platform:
    environment:
      SYNTHETIC_DATA_PLATFORM_CONFIG: /config/platform.local.toml
    volumes:
      - ../../synthetic-data-platform/config/platform.local.toml:/config/platform.local.toml:ro

  synthetic-result-export-worker:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.synthetic-data-platform
    command: ["uv", "run", "--no-sync", "synthetic-result-export-worker"]
    environment:
      SYNTHETIC_DATA_PLATFORM_CONFIG: /config/platform.local.toml
    depends_on:
      mysql:
        condition: service_healthy
      synthetic-data-platform:
        condition: service_healthy
    volumes:
      - ../../synthetic-data-platform/config/platform.local.toml:/config/platform.local.toml:ro
