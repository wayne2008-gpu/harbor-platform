jobs_dir = "/workspace/jobs"
max_running_jobs = 1
poll_interval_sec = 2
control_plane_url = "http://harbor-api:8080"
poll_control_plane_jobs = true
control_plane_queue_limit = 1
rocketmq_namesrv = "rocketmq-namesrv:9876"
rocketmq_topic = "harbor_jobs"
rocketmq_consumer_group = "harbor-runners"
rocketmq_ack_timeout_sec = 3600

[artifact_storage]
backend = "cos"
retain_local = true
local_retention_hours = 72
upload_manifest = true
upload_policy = "job_dir_all"
cos_key_layout = "attempt_execution"
fail_job_on_upload_error = false
upload_retry_attempts = 2
upload_retry_wait_sec = 1

[artifact_storage.cos]
bucket = "harbor-artifacts-1250000000"
region = "ap-guangzhou"
prefix = "dev"
secret_id = "replace-with-cos-secret-id"
secret_key = "replace-with-cos-secret-key"

[input_materialization]
backend = "cos"
retain_local = true
local_retention_hours = 72
verify_checksum = true
max_archive_bytes = 10737418240
max_extracted_bytes = 53687091200
max_file_count = 200000

[input_materialization.cos]
bucket = "harbor-datasets-1250000000"
region = "ap-guangzhou"
prefix = "dev/datasets"
secret_id = "replace-with-cos-secret-id"
secret_key = "replace-with-cos-secret-key"

[capabilities]
providers = ["docker", "ags", "tke"]
features = ["cos-input"]
