# Optional override for M5 real Docker smoke jobs.
#
# This file does not start Docker and does not mount the host Docker socket.
# Point the runners at an explicitly managed rootless Docker daemon, for example:
#
#   export HARBOR_RUNNER_DOCKER_HOST=tcp://host.docker.internal:2375
#   docker compose -f compose.dev.yml -f compose.rootless-docker.yml up --build

services:
  harbor-runner-1: &rootless-docker-runner
    environment:
      DOCKER_HOST: ${HARBOR_RUNNER_DOCKER_HOST:?set HARBOR_RUNNER_DOCKER_HOST}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  harbor-runner-2:
    <<: *rootless-docker-runner
