apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: harbor-control-plane-hpa
  namespace: harbor-platform
  labels:
    app.kubernetes.io/name: harbor-control-plane
    app.kubernetes.io/part-of: harbor-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: harbor-control-plane
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
