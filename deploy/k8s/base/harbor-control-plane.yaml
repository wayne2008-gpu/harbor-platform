apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-control-plane
  namespace: harbor-platform
  labels:
    app.kubernetes.io/name: harbor-control-plane
    app.kubernetes.io/part-of: harbor-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor-control-plane
      app.kubernetes.io/part-of: harbor-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-control-plane
        app.kubernetes.io/part-of: harbor-platform
    spec:
      containers:
        - name: harbor-control-plane
          image: example.tencentcloudcr.com/harbor-platform/harbor-control-plane:CHANGE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HARBOR_CONTROL_PLANE_CONFIG
              value: /config/control-plane.toml
          envFrom:
            - secretRef:
                name: harbor-control-plane-secret
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: control-plane-config
              mountPath: /config/control-plane.toml
              subPath: control-plane.toml
              readOnly: true
      volumes:
        - name: control-plane-config
          configMap:
            name: harbor-control-plane-config
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-control-plane
  namespace: harbor-platform
  labels:
    app.kubernetes.io/name: harbor-control-plane
    app.kubernetes.io/part-of: harbor-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: harbor-control-plane
    app.kubernetes.io/part-of: harbor-platform
  ports:
    - name: http
      port: 8080
      targetPort: http
