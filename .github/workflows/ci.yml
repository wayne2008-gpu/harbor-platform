name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.12.3"

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    env:
      SUBMODULE_TOKEN: ${{ secrets.HARBOR_SUBMODULE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Checkout submodules
        run: |
          git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Test contracts
        working-directory: harbor-service-contracts
        run: |
          uv sync --frozen --dev
          uv run pytest tests -q

  control-plane:
    name: Control Plane
    runs-on: ubuntu-latest
    env:
      SUBMODULE_TOKEN: ${{ secrets.HARBOR_SUBMODULE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Checkout submodules
        run: |
          git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Lint and test control plane
        working-directory: harbor-control-plane
        run: |
          uv sync --frozen --dev
          uv run ruff check src tests
          uv run pytest tests -q

  synthetic-data-platform:
    name: Synthetic Data Platform
    runs-on: ubuntu-latest
    env:
      SUBMODULE_TOKEN: ${{ secrets.HARBOR_SUBMODULE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Checkout submodules
        run: |
          git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Lint and test synthetic data platform
        working-directory: synthetic-data-platform
        run: |
          uv sync --frozen --dev
          uv run ruff check src tests
          uv run pytest tests -q

  harbor-runner:
    name: Harbor Runner
    runs-on: ubuntu-latest
    env:
      SUBMODULE_TOKEN: ${{ secrets.HARBOR_SUBMODULE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Checkout submodules
        run: |
          git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Lint and test runner
        working-directory: harbor
        run: |
          uv sync --frozen --extra rocketmq --dev
          uv run ruff check src/harbor/runner tests/unit/runner
          uv run pytest tests/unit/runner -q

  harbor-providers:
    name: Harbor AGS/TKE Targeted Tests
    runs-on: ubuntu-latest
    env:
      SUBMODULE_TOKEN: ${{ secrets.HARBOR_SUBMODULE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Checkout submodules
        run: |
          git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Run AGS/TKE targeted tests
        working-directory: harbor
        run: |
          uv sync --frozen --extra ags --extra tke --dev
          uv run pytest \
            tests/unit/environments/test_ags_clients.py \
            tests/unit/environments/test_ags.py \
            tests/unit/environments/test_ags_config.py \
            tests/unit/environments/test_ags_queue.py \
            tests/unit/environments/test_tke_config.py \
            tests/unit/environments/test_tke.py \
            tests/unit/environments/test_environment_definition.py \
            tests/unit/environments/test_provider_resource_capabilities.py \
            -q

  compose-config:
    name: Compose Config
    runs-on: ubuntu-latest
    env:
      SUBMODULE_TOKEN: ${{ secrets.HARBOR_SUBMODULE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Checkout submodules
        run: |
          git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive
      - name: Validate Compose files and smoke assets
        working-directory: deploy/docker-compose
        env:
          HARBOR_PLATFORM_ROOT: ${{ github.workspace }}
        run: |
          bash -n scripts/submit-and-wait-job.sh
          docker compose -f compose.dev.yml config >/tmp/harbor-compose-dev.yml
          jq empty smoke/docker-touch-file-smoke-job.local.json
          jq empty smoke/ags-otel-bench-smoke-job.json
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          root = Path("../..").resolve()
          for path in [
              root / "harbor/config/runner.local.toml",
              root / "harbor-control-plane/config/control-plane.local.toml",
          ]:
              tomllib.loads(path.read_text())
          PY
